[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0"
]

[project]
name = "buscar-benchmark-analysis"
version = "0.1.0"
description = "Analysis of Buscar benchmark datasets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "polars>=1.0.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.12.0",
  "pyyaml>=6.0.1",
  "ipykernel>=6.29.0",
  "requests>=2.34.2",
  "tqdm>=4.68.2",
  "pycytominer>=1.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
managed = true
package = true # Forces uv to package the root directories
